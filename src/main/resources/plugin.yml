name: RTPExtended
version: 1.0.0
main: com.example.rtpextended.RTPExtendedPlugin
api-version: '1.21'
author: OpenAI
description: Standalone random teleport and player homes plugin.
commands:
  rtp:
    description: Randomly teleport to a dimension.
    usage: /rtp [overworld|nether|end]
  sethome:
    description: Set a named home at your current location.
    usage: /sethome <name>
  home:
    description: Teleport to a named home.
    usage: /home <name>
  homes:
    description: List your homes.
    usage: /homes
  delhome:
    description: Delete a named home.
    usage: /delhome <name>
  setmaxhomes:
    description: Admin command to set a player's maximum homes.
    usage: /setmaxhomes <player> <amount>
permissions:
  rtpextended.admin:
    description: Allows changing player home limits and reloading the plugin.
    default: op
