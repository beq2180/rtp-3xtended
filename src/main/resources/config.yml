default-max-homes: 3

# RTP settings. Coordinates are chosen inside this square radius.
rtp:
  overworld:
    min-radius: 500
    max-radius: 5000
  nether:
    min-radius: 250
    max-radius: 2500
  end:
    min-radius: 500
    max-radius: 5000
  max-attempts: 20
  # Safety checks reject obvious dangerous/unsuitable landing blocks.
  avoid-water: true
  avoid-lava: true
  avoid-fire: true
  avoid-leaves: true

messages:
  prefix: "&8[&bRTP&8] &r"
